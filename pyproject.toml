[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shellquote"
version = "0.1.0"
description = "Normalize, quote, and validate shell arguments."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["shell", "quoting", "cli", "security", "devtools", "python", "posix"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.scripts]
shellquote = "shellquote:main"

[tool.setuptools]
py-modules = ["shellquote"]

[tool.setuptools.packages.find]
where = ["."]
include = ["shellquote*"]

[project.optional-dependencies]
dev = ["pytest"]
[project.urls]
Repository = "https://github.com/ethancarter-ai/shellquote"
